name: Publish POF website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test release.test.mjs motion.test.mjs
      - name: Stage public website only
        run: |
          mkdir _site
          cp index.html credits.html styles.css app.mjs release.mjs motion.mjs downloads.json _site/
          cp -R assets manual _site/
          pof_asset_revision="$(git rev-parse --short=12 HEAD)"
          sed -i "s|styles.css|styles.css?v=$pof_asset_revision|g; s|app.mjs|app.mjs?v=$pof_asset_revision|g" _site/index.html _site/credits.html
          sed -i "s|./release.mjs|./release.mjs?v=$pof_asset_revision|g; s|./motion.mjs|./motion.mjs?v=$pof_asset_revision|g" _site/app.mjs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Wait for artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          for attempt in {1..12}; do
            if gh api "$endpoint" --jq '.artifacts[].id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo 'The uploaded Pages artifact is not listed yet.' >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
